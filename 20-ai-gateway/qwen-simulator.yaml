apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-sim
  namespace: ai-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qwen-sim
  template:
    metadata:
      labels:
        app: qwen-sim
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
        - name: simulator
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
          args:
            - "--model"
            - "Qwen/Qwen3-32B"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
