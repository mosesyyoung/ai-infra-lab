apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-sim
  namespace: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepseek-sim
  template:
    metadata:
      labels:
        app: deepseek-sim
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
        - name: simulator
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
          args:
            - "--model"
            - "deepseek/DeepSeek-r1"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
