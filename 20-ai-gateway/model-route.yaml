apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen-router
  namespace: ai-gateway
spec:
  parentRefs:
    - name: inference-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
          headers:
            - type: Exact
              name: X-Gateway-Base-Model-Name
              value: Qwen/Qwen3-32B
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: qwen-router
      timeouts:
        request: 300s

    - matches:
        - path:
            type: PathPrefix
            value: /v1/
          headers:
            - type: Exact
              name: X-Gateway-Base-Model-Name
              value: deepseek/DeepSeek-r1
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: deepseek-router
      timeouts:
        request: 300s
